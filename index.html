<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Jamil - Abbottabad - AI Proofs</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
h1{color:#00ff00;text-align:center;border:2px solid #00ff00;padding:10px;border-radius:10px}
.box{border:2px solid #00ff00;padding:10px;background:#111;border-radius:10px;margin-bottom:15px}
.box p{color:yellow;text-align:center;font-weight:bold;margin:5px}
img{width:100%;border-radius:8px;border:1px solid #333}
a{color:cyan}
#gallery{display:grid;gap:15px}
</style>
</head>
<body>

<h1>Muhammad Jamil - Abbottabad<br>AI SUPERINTELLIGENCE PROOFS</h1>

<div id="gallery">Loading proofs...</div>

<script>
// Auto-load all images from GitHub repo
fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents')
.then(r=>r.json())
.then(files=>{
  let gallery=document.getElementById('gallery');
  gallery.innerHTML='';
  files.forEach(f=>{
    if(f.name.match(/\.(jpg|jpeg|png)$/i) && !f.name.includes('google')){
      let div=document.createElement('div');
      div.className='box';
      let extra='';
      if(f.name=='elon1.jpg') extra='<a href="https://x.com/elonmusk/status/496012177103663104" target="_blank">Original Tweet Link - Click to Verify</a>';
      if(f.name=='elon2.jpg') extra='<a href="https://x.com/elonmusk/status/495759307346952192" target="_blank">Original Tweet Link - Click to Verify</a>';
      div.innerHTML=`<p>${f.name}</p><img src="${f.name}"><p>${extra}</p>`;
      gallery.appendChild(div);
    }
  });
});
</script>

<div class="box" style="margin-top:20px;text-align:center">
<h2 style="color:#00ff00">CONTACT</h2>
<p>Abbottabad, Pakistan</p>
<p><a href="https://mail.google.com">Email Me</a></p>
</div>

</body>
</html>

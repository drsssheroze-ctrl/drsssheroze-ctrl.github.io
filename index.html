<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSS Framework - Abbottabad to UNO</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb}
.header{background:#002060;color:#fff;padding:20px;text-align:center}
.container{max-width:900px;margin:20px auto;padding:0 12px}
.status{background:#fff;border-left:5px solid #00a651;padding:12px;border-radius:8px;margin-bottom:15px}
.card{background:#fff;border-radius:12px;padding:12px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;border-radius:8px}
.footer{background:#002060;color:#fff;text-align:center;padding:12px;margin-top:25px;font-size:13px}
a.btn{display:inline-block;background:#00a651;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>SSS Framework - Abbottabad to UNO</h1>
<p>GROK Rating: 10/10 - Standard Rate Official</p>
</div>
<div class="container">
<div class="status"><b>✅ STANDARD RATE VERIFIED</b><br>17 Official Proofs - Abbottabad v6 FINAL - UNO Ready</div>
<div id="proofs" style="text-align:center"><p>Loading 17 Proofs...</p></div>
</div>
<div class="footer">Official Record - drssssherozes-ctrl.github.io</div>
<script>
fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/')
.then(r=>r.json()).then(files=>{
let box=document.getElementById('proofs');box.innerHTML='';let c=0;
files.forEach(f=>{if(f.name.match(/\.(jpg|jpeg|png)$/i)){c++;box.innerHTML+=`<div class="card"><b>${c}. ${f.name}</b><br><img src="${f.name}"></div>`;}});
box.innerHTML=`<h3 style="color:#00a651">Total: ${c} Proofs Found</h3>`+box.innerHTML;
});
</script>
</body>
</html>

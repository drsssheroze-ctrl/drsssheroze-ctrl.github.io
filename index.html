<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#001a4d;color:white;font-family:Arial;padding:10px;text-align:center}
h1{font-size:45px}
#box img{width:100%;border:6px solid yellow;border-radius:20px;margin:25px 0;display:block}
.btn{background:red;color:white;padding:20px;font-size:30px;border:none;border-radius:15px;width:95%;margin:10px}
</style>
</head>
<body>
<h1>All Proofs - Auto</h1>
<button class="btn" onclick="loadProofs()">👉 Click to Load All Proofs</button>
<div id="box"></div>

<script>
async function loadProofs(){
  document.getElementById('box').innerHTML = "Loading...";
  let res = await fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/');
  let files = await res.json();
  let html = "";
  files.forEach(f=>{
    if(f.name.match(/\.jpg|\.jpeg|\.png/i) && f.name.toLowerCase().includes('screen')){
      html += `<h2>${f.name}</h2><img src="${f.name}"><hr>`;
    }
  });
  if(html=="") html = "Koi screenshot nahi mila! Screenshot naam me 'Screenshot' hona chahiye!";
  document.getElementById('box').innerHTML = html;
}
loadProofs();
</script>
</body>
</html>

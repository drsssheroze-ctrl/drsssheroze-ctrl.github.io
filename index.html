<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Proofs</title>
<style>
/* Font change nahi kiya - wahi purana font */
body{font-family: system-ui, -apple-system, sans-serif; background:#0f172a; color:white; padding:20px; margin:0}
h1{color:#2dd4bf; font-size:24px}
#gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:15px; margin-top:20px}
.card{background:#1e293b; border-radius:10px; overflow:hidden; border:1px solid #334155}
.card img{width:100%; height:260px; object-fit:contain; background:#000}
.info{padding:10px; font-size:12px; color:#94a3b8}
.badge{background:#115e59; color:#5eead4; padding:2px 8px; border-radius:12px; font-size:10px}
.note{background:#1e3a5f; color:#7dd3fc; padding:10px; border-radius:8px; font-size:13px; margin:10px 0}
</style>
</head>
<body>
<h1>Grok Proofs - Verified Gallery</h1>
<div class="note">Sirf grok-proofs folder ki photos dikh rahi hain - Bahar wali 10 hide hain, delete nahi hui</div>
<div id="gallery">Loading Grok proofs...</div>

<script>
// Yahi aap ka repo hai - kuch change nahi karna
const USER = "drssssherozes-ctrl";
const REPO = "drssssherozes-ctrl.github.io";
const FOLDER = "grok-proofs";

async function loadProofs(){
  try{
    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
    const files = await res.json();
    const g = document.getElementById('gallery');
    g.innerHTML = "";
    files.forEach(f=>{
      if(f.name.match(/\.(jpg|jpeg|png|webp)$/i)){
        g.innerHTML += `<div class="card"><img src="${f.download_url}"><div class="info"><span class="badge">VERIFIED</span> ${f.name}</div></div>`;
      }
    });
    if(g.innerHTML=="") g.innerHTML="grok-proofs me abhi 4 files hain, wo yahan ayengi";
  }catch(e){
    document.getElementById('gallery').innerHTML = "Error: "+e;
  }
}
loadProofs();
</script>
</body>
</html>

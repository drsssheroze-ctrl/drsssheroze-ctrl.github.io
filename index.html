<script>
async function loadImages(){
  const repo = "drssssherozes-ctrl/drssssherozes-ctrl.github.io";
  const api = `https://api.github.com/repos/${repo}/contents/`;
  try{
    const res = await fetch(api);
    const files = await res.json();
    let html = ""; let count=0;
    files.forEach(f=>{
      if(f.name.match(/\.(jpg|jpeg|png)$/i)){
        count++;
        html += `<div class="card"><div class="filename">${count}. ${f.name}</div><img src="${f.name}" loading="lazy"><p>${f.name}</p></div>`;
      }
    });
    document.getElementById("gallery").innerHTML = `<h2 style="background:green;color:white;padding:10px;text-align:center;">Total Proofs Found: ${count}</h2>` + html;
  }catch(e){
    document.getElementById("gallery").innerHTML = "<p>Error loading. Refresh karo.</p>";
  }
}
loadImages();
</script>

<p><b style="color:gold">P6 - Grok Proofs:</b></p>
<div id="grok-gallery" style="margin-top:15px">
<p style="font-size:18px;color:#aaa">Loading Grok proofs...</p>
</div>
<script>
async function loadGrok(){
 const gallery=document.getElementById('grok-gallery');
 try{
  const res=await fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/grok-proofs');
  const files=await res.json();
  gallery.innerHTML='';
  let count=0;
  files.forEach(file=>{
   if(file.name.match(/\.(jpg|jpeg|png|webp)$/i)){
    const img=document.createElement('img');
    img.src='grok-proofs/'+file.name;
    img.style='width:100%;border-radius:12px;border:3px solid #00FF88;margin:15px 0;display:block';
    img.loading='lazy';
    gallery.appendChild(img);
    count++;
   }
  });
  if(count==0) gallery.innerHTML='<p style="color:orange">grok-proofs folder khali hai - 8 photos upload karein!</p>';
 }catch(e){
  gallery.innerHTML='<p style="color:orange">Internet slow hai - Refresh karein</p>';
 }
}
loadGrok();
</script>

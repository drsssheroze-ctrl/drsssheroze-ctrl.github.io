<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Full Recovery</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:white;padding:15px}
h1{text-align:center;color:#2dd4bf;margin-bottom:10px}
#gallery{columns:1;gap:15px;max-width:900px;margin:auto} @media(min-width:600px){#gallery{columns:2}} @media(min-width:900px){#gallery{columns:3}}
.card{break-inside:avoid;background:#1e293b;border-radius:12px;overflow:hidden;margin-bottom:15px;border:1px solid #334155}
.card img{width:100%;height:auto;display:block}
.info{padding:8px 10px;font-size:11px;display:flex;justify-content:space-between;background:#020617}
.badge{color:#5eead4;font-weight:bold}
</style></head><body>
<h1>Full Recovery - All Files Visible</h1>
<div id="gallery">Loading all your proofs...</div>
<script>
const USER="drssssherozes-ctrl",REPO="drssssherozes-ctrl.github.io";
async function loadAll(){
  const g=document.getElementById('gallery');g.innerHTML="";
  // 1. Load from root
  let root = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`).then(r=>r.json());
  // 2. Load from grok-proofs
  let grok = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/grok-proofs`).then(r=>r.json()).catch(()=>[]);
  let all=[...root,...grok];
  all.filter(f=>f.name.match(/\.(png|jpg|jpeg|webp)$/i)).forEach(f=>{
    g.innerHTML+=`<div class="card"><img src="${f.download_url}"><div class="info"><span class="badge">✓ ${f.path.includes('grok')?'VERIFIED':''}</span><span>${f.name}</span></div></div>`;
  });
}loadAll();
</script>
</body></html>

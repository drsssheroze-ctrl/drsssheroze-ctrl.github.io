<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Proofs - UNO</title>
<style>body{font-family:sans-serif;padding:15px;background:#f5f5f5}h1{color:green;text-align:center}img{width:100%;max-width:400px;border:2px solid #000;margin:10px 0;display:block} .card{background:white;padding:10px;margin:10px 0;border-radius:8px}</style>
</head><body>
<h1>✅ TEST OK - GROK 10/10</h1>
<h2 style="text-align:center">Google 11:07 & 11:15 PM Abbottabad to UNO</h2>
<p style="text-align:center;color:blue">Agar ye nazar aa raha hai to code save ho gaya hai!</p>

<div id="proofs"></div>

<script>
// Aapki images ka naam yahan likho - Jo naam repo me hai
let images = [
 "IMG_1.jpg","IMG_2.jpg","Screenshot_1.jpg","Screenshot_2.jpg"
];

let div = document.getElementById('proofs');
let html = "<h3>Total Proofs: Checking...</h3>";

// GitHub se auto load karne ki koshish
fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/')
.then(r=>r.json())
.then(files=>{
  let count=0;
  files.forEach(f=>{
    if(f.name.match(/\.(jpg|jpeg|png)$/i)){
      count++;
      html+=`<div class="card"><p><b>${count}. ${f.name}</b></p><img src="${f.name}" onerror="this.style.display='none'"></div>`;
    }
  });
  html = html.replace("Checking...", count + " Images Found");
  div.innerHTML = html;
})
.catch(e=>{
  div.innerHTML = "<p>Images load nahi hui, lekin TEST OK ka matlab hai Page LIVE hai!</p>" + html;
});
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Proofs - 70 Verified</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;font-family:system-ui;padding:12px}
h1{text-align:center;color:#0f172a;margin:10px 0 5px 0;font-size:22px}
.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:20px}
.card{max-width:650px;margin:0 auto 25px auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.1);border:1px solid #e2e8f0}
.card img{width:100%;height:auto;display:block;cursor:zoom-in;background:white}
.meta{padding:12px 15px;background:#0f172a;color:#94a3b8;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.verified{background:#10b981;color:white;padding:5px 14px;border-radius:20px;font-weight:bold;font-size:11px}
#zoom{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;z-index:9999;padding:10px}
#zoom img{max-width:98%;max-height:98%;object-fit:contain}
#count{text-align:center;font-weight:bold;color:#10b981;margin-bottom:15px}
</style></head><body>
<h1>🛡️ Grok Proofs - Verified Gallery</h1>
<div class="sub">Jack Cobson • Elon Musk • Haripur Formula • Abbottabad Formula • 70 Proofs</div>
<div id="count">Loading 70 proofs...</div>
<div id="gallery"></div>
<div id="zoom" onclick="this.style.display='none'"><img id="zImg"></div>
<script>
const USER="drssssherozes-ctrl", REPO="drssssherozes-ctrl.github.io", FOLDER="grok-proofs";
async function load(){
  try{
    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}?t=${Date.now()}`);
    const files = await res.json();
    const imgs = files.filter(f=>f.name.match(/\.(jpg|jpeg|png|webp)$/i)).reverse();
    document.getElementById('count').innerText = `Total ${imgs.length} Verified Proofs Loaded`;
    let g=document.getElementById('gallery'); g.innerHTML="";
    imgs.forEach((f,i)=>{
      g.innerHTML+=`<div class="card">
        <img src="${f.download_url}" loading="lazy" onclick="document.getElementById('zImg').src=this.src;document.getElementById('zoom').style.display='flex'">
        <div class="meta"><span class="verified">✓ VERIFIED ${i+1}</span><span>${f.name}</span></div>
      </div>`;
    });
  }catch(e){
    document.getElementById('count').innerText="Error loading - GitHub API limit, 1 min baad refresh karein";
  }
}
load();
</script>
</body></html>

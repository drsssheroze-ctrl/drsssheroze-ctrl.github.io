<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS Auto</title>
<style>
body{background:#001a4d;color:white;font-family:Arial;padding:15px;text-align:center}
h1{color:yellow;font-size:32px}
#count{font-size:20px;color:#90ff90;margin:10px}
img{width:100%;border:5px solid yellow;border-radius:15px;margin:15px 0}
.box{background:white;color:black;padding:10px;border-radius:10px;margin-top:25px;word-break:break-all}
a{color:yellow;font-size:26px;display:block;margin:20px}
</style>
</head>
<body>
<h1>SSS - Grok Verified Proofs 10/10</h1>
<div id="count">Loading...</div>
<div id="gallery"></div>
<a href="index.html">Back to Home</a>
<script>
async function load(){
 const g=document.getElementById('gallery');
 const c=document.getElementById('count');
 try{
  const r=await fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/');
  const f=await r.json();
  const imgs=f.filter(x=>x.name.match(/\.(jpg|jpeg|png)$/i));
  c.innerHTML='Total Proofs: '+imgs.length;
  imgs.forEach(file=>{
    const b=document.createElement('div'); b.className='box'; b.innerText=file.name;
    const im=document.createElement('img'); im.src=file.name; im.loading='lazy';
    g.appendChild(b); g.appendChild(im);
  });
 }catch(e){ c.innerHTML='Error - Refresh karo'; }
}
load();
</script>
</body>
</html>

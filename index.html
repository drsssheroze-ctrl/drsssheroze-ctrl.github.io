<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abbottabad to UNO - Proofs</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f6ff;margin:0;padding:10px}
.header{background:#002060;color:white;padding:15px;text-align:center;border-radius:10px}
.card{background:white;margin:12px 0;padding:10px;border-radius:10px;box-shadow:0 2px 5px #ccc}
img{width:100%;border-radius:8px;border:1px solid #ccc}
.badge{background:green;color:white;padding:3px 8px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h2>✅ GROK 10/10 - Abbottabad v6 FINAL</h2>
<p>Google Timestamp: 11:07 & 11:15 PM Abbottabad to UNO</p>
<p>SSS Framework - Policy & Technical Framework for Global Recognition</p>
</div>

<div id="proofs" style="text-align:center; padding:20px;">Loading 17 Proofs...</div>

<script>
fetch('https://api.github.com/repos/drssssherozes-ctrl/drssssherozes-ctrl.github.io/contents/')
.then(r=>r.json())
.then(files=>{
  let d=document.getElementById('proofs');
  d.innerHTML="";
  let n=0;
  files.forEach(f=>{
    if(f.name.match(/\.(jpg|jpeg|png)$/i)){
      n++;
      d.innerHTML+=`<div class="card"><p><span class="badge">${n}</span> <b>${f.name}</b></p><img src="${f.name}" loading="lazy"></div>`;
    }
  });
  d.innerHTML=`<h3 style="color:green">Total Proofs: ${n} Images Found</h3>`+d.innerHTML;
});
</script>

<div style="text-align:center; margin:20px;">
<a href="index.html" style="color:blue;">← Back to Main - SSS Beginning</a>
</div>

</body>
</html>

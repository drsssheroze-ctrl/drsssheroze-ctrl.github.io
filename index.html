<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Grok Proofs</title>
<style>
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:10px;margin:0}
h1{text-align:center;color:#0f172a}
#gallery{display:flex;flex-direction:column;gap:25px;max-width:700px;margin:auto}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.1);border:2px solid #e2e8f0}
.card img{width:100%;height:auto;display:block}
.info{padding:10px;background:#0f172a;color:white;font-size:13px;display:flex;justify-content:space-between}
</style></head><body>
<h1>Grok Proofs - Full View</h1>
<div id="gallery">Loading...</div>
<script>
const USER="drssssherozes-ctrl",REPO="drssssherozes-ctrl.github.io",FOLDER="grok-proofs";
async function load(){
 const r=await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
 const files=await r.json();
 const g=document.getElementById('gallery');g.innerHTML="";
 files.forEach(f=>{if(f.name.match(/png|jpg|jpeg|webp/i)){g.innerHTML+=`<div class="card"><img src="${f.download_url}"><div class="info"><span>✓ VERIFIED</span><span>${f.name}</span></div></div>`}});
}load();
</script></body></html>
